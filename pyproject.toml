[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vetgate"
version = "0.1.0"
description = "Catch what your AI coding agent silently trusts: a personal-config watchdog + all-branches sweep for Claude Code, Cursor, Copilot & friends."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Rakshit Rameshbabu" }]
keywords = [
  "ai-security", "coding-agent", "claude-code", "cursor", "mcp",
  "prompt-injection", "supply-chain", "file-integrity-monitoring",
  "devsecops", "agent-security", "security-tools", "watchdog",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/rakshit-737/vetgate"
Issues = "https://github.com/rakshit-737/vetgate/issues"

[project.scripts]
vetgate = "vetgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vetgate = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E702"]  # long evidence strings; compact one-liners in fixtures
